submission:
  title: "Threat Intelligence Correlation & Alert Prioritisation Assistant"

  problem_statement: >
    Defence and security analysts receive large volumes of alerts from SIEM
    systems, cyber sensors, threat-intelligence sources, and intelligence
    reports in different formats. Correlating these signals manually is
    time-consuming and can cause genuine threats to be missed while analysts
    spend valuable time investigating false positives.

  solution_summary: >
    CyberFusion is an AI-assisted threat intelligence platform that ingests,
    normalizes, correlates, and prioritizes security events from multiple
    sources. Its deterministic correlation and risk engines identify related
    threats and calculate authoritative priorities, while an AI intelligence
    layer generates evidence-based BLUF assessments, possible intent,
    reasoning, and recommended actions for human analysts.

  key_features:
    - "Multi-source security event ingestion and normalization"
    - "Evidence-based correlation of related security events"
    - "Risk scoring and automatic alert prioritisation"
    - "AI-generated BLUF threat intelligence reports with guardrails"
    - "Analyst dashboard for reviewing threats, correlations, risks, and intelligence"

  tech_stack:
    languages:
      - "JavaScript"
      - "SQL"
    frameworks:
      - "React"
      - "Vite"
      - "Express.js"
      - "Tailwind CSS"
    ibm_technologies:
      - "IBM BoB AI"
    databases:
      - "Supabase PostgreSQL"
    other:
      - "Node.js"
      - "Groq AI"
      - "Axios"
      - "React Router"
      - "React Flow"
      - "Recharts"
      - "Jest"
      - "Supertest"
      - "Vitest"
      - "Netlify"

  what_we_are_most_proud_of: >
    We are most proud of the complete evidence-to-intelligence pipeline that
    connects multi-source security events to explainable correlation,
    authoritative risk prioritisation, and guarded AI-generated intelligence.
    In our verified demonstration scenario, four related events from three
    source types produced a correlation score of 77 (VERY_STRONG), a risk score
    of 81 (CRITICAL), and an AI-generated intelligence assessment with 92
    confidence. The AI layer cannot override the authoritative risk decision
    and all generated intelligence passes application-level guardrails.

  known_limitations: >
    The current hackathon prototype uses simulated structured security events
    representing SIEM, cyber sensor, threat-intelligence, and intelligence
    report sources rather than connecting to live enterprise feeds. Production
    deployments could connect the same ingestion interfaces to real SIEM,
    sensor, and threat-intelligence systems. The application also uses a
    human-in-the-loop model, so AI-generated recommendations are advisory and
    require analyst review before operational action.

